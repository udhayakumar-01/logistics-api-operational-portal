<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logistics API Operational Documentation & Integration Readiness Portal</title>
    <meta name="description" content="Operational API Documentation Portal with live Try-It execution, failure injection, rate limit simulation, evidence drill-down, and data freshness tracking." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-nav {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .badge-fresh {
        background-color: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .badge-stale {
        background-color: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .badge-missing {
        background-color: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
    </style>

    <!-- React 18 & Babel Standalone CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- Embedded Standalone Interactive Portal Script -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      const BASE_URL = 'http://localhost:8000/api/v1';

      async function apiCall(endpoint, options = {}, apiKey = 'demo-api-key-partner-admin') {
        const headers = new Headers(options.headers || {});
        if (apiKey) headers.set('X-API-Key', apiKey);
        if (!headers.has('Content-Type') && options.body) headers.set('Content-Type', 'application/json');

        try {
          const res = await fetch(`${BASE_URL}${endpoint}`, { ...options, headers });
          const status = res.status;
          const text = await res.text();
          let data = null;
          try { data = JSON.parse(text); } catch(e) { data = text; }
          const resHeaders = {};
          res.headers.forEach((v, k) => resHeaders[k] = v);
          return { status, data, headers: resHeaders };
        } catch (e) {
          return { status: 500, data: { error: e.message }, headers: {} };
        }
      }

      function App() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [role, setRole] = useState('Partner Developer');
        const [metrics, setMetrics] = useState(null);
        const [tryItEp, setTryItEp] = useState(null);
        const [tryItBody, setTryItBody] = useState('');
        const [tryItRes, setTryItRes] = useState(null);

        // Failure Injection State
        const [injResult, setInjResult] = useState(null);

        // Evidence State
        const [evidenceId, setEvidenceId] = useState('SHP-0001');
        const [evidenceData, setEvidenceData] = useState(null);

        useEffect(() => {
          loadMetrics();
        }, []);

        const loadMetrics = async () => {
          const res = await apiCall('/dashboard/metrics');
          if (res.data) setMetrics(res.data);
        };

        const loadEvidence = async (id) => {
          const res = await apiCall(`/evidence/${id}`);
          if (res.data) setEvidenceData(res.data);
        };

        const handleInject = async (type) => {
          setInjResult(null);
          if (type === 'duplicate') {
            const res = await apiCall('/simulator/inject-event', {
              method: 'POST',
              body: JSON.stringify({ entity_id: 'SHP-0001', is_duplicate: true, event_type: 'PICKED_UP' })
            });
            setInjResult(res.data);
          } else if (type === 'out_of_order') {
            const res = await apiCall('/simulator/inject-event', {
              method: 'POST',
              body: JSON.stringify({ entity_id: 'SHP-0001', is_out_of_order: true, event_type: 'PICKED_UP', sequence_number: 1 })
            });
            setInjResult(res.data);
          } else if (type === 'delayed') {
            const res = await apiCall('/simulator/inject-event', {
              method: 'POST',
              body: JSON.stringify({ entity_id: 'SHP-0001', is_delayed: true, event_type: 'IN_TRANSIT', sequence_number: 5 })
            });
            setInjResult(res.data);
          } else if (type === 'rate_limit') {
            await apiCall('/simulator/trigger-limit', { method: 'POST' });
            const res = await apiCall('/shipments/SHP-0001');
            setInjResult({ scenario: 'RATE_LIMIT_BREACH', status: res.status, headers: res.headers, response: res.data });
          } else if (type === 'missing_auth') {
            const res = await apiCall('/shipments/SHP-0001', {}, '');
            setInjResult({ scenario: 'MISSING_AUTH_HEADER', status: res.status, response: res.data });
          } else if (type === 'invalid_key') {
            const res = await apiCall('/shipments/SHP-0001', {}, 'invalid-key-xyz');
            setInjResult({ scenario: 'INVALID_API_KEY', status: res.status, response: res.data });
          }
        };

        const handleTryItExecute = async () => {
          if (!tryItEp) return;
          let body = undefined;
          if (tryItBody.trim()) {
            try { body = JSON.stringify(JSON.parse(tryItBody)); } catch(e) { alert("Invalid JSON"); return; }
          }
          const res = await apiCall(tryItEp.path, { method: tryItEp.method, body });
          setTryItRes(res);
        };

        const endpoints = [
          { method: 'POST', path: '/shipments', summary: 'Create New Shipment Order', body: { seller_id: 'SELLER-001', warehouse_id: 'WH-001', carrier_id: 'CAR-001', destination: 'Chennai', items: [{ sku: 'SKU-1001', quantity: 2 }] } },
          { method: 'GET', path: '/shipments/SHP-0001', summary: 'Get Shipment Details & State Machine' },
          { method: 'POST', path: '/events', summary: 'Ingest Logistics Status Event (Idempotent)', body: { event_id: 'EVT-9901', event_type: 'PICKED_UP', entity_id: 'SHP-0001', timestamp: '2026-09-08T09:40:00Z', source: 'CARRIER-APP', sequence_number: 2, payload: { location: 'Bengaluru Hub' } } },
          { method: 'GET', path: '/evidence/SHP-0001', summary: 'Get Entity Operational Evidence Audit Trace' },
          { method: 'GET', path: '/limits', summary: 'Get Operational & Rate Limits' },
          { method: 'GET', path: '/health', summary: 'Operational Health Check' }
        ];

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
            
            {/* Header */}
            <header className="glass-nav sticky top-0 z-40 px-6 py-3 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">
                  LOGI
                </div>
                <div>
                  <h1 className="font-display font-bold text-lg text-white flex items-center gap-2">
                    Logistics API Portal
                    <span className="text-xs font-mono bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-full">
                      Operational MVP
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Interactive API Limits, Failure Behavior & Event Consistency</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-slate-300">Backend:</span>
                  <span className="text-emerald-400 font-bold font-mono">HTTP 200 OK</span>
                </div>

                <div className="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-xs">
                  <span className="text-slate-400">Role:</span>
                  <select value={role} onChange={(e) => setRole(e.target.value)} className="bg-transparent text-sky-400 font-bold focus:outline-none cursor-pointer">
                    <option value="Seller" className="bg-slate-900">Seller</option>
                    <option value="Carrier" className="bg-slate-900">Carrier</option>
                    <option value="Warehouse" className="bg-slate-900">Warehouse</option>
                    <option value="Partner Developer" className="bg-slate-900">Partner Developer</option>
                    <option value="Operations Admin" className="bg-slate-900">Operations Admin</option>
                  </select>
                </div>
              </div>
            </header>

            {/* Navigation Tabs */}
            <nav className="bg-slate-900/90 border-b border-slate-800 px-6 overflow-x-auto">
              <div className="max-w-7xl mx-auto flex items-center gap-2 py-2">
                {[
                  { id: 'dashboard', label: '📊 Dashboard' },
                  { id: 'explorer', label: '⚡ API Explorer (Try-It)' },
                  { id: 'limits', label: '⏱️ Rate Limits (429)' },
                  { id: 'events', label: '🛡️ Events & Evidence' },
                  { id: 'simulator', label: '💥 Failure Injector' },
                  { id: 'experiments', label: '📈 TTFSI Experiments' },
                  { id: 'security', label: '🔒 Security & Misuse' },
                  { id: 'docs', label: '📚 Risk Register & Docs' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap cursor-pointer transition-all ${
                      activeTab === tab.id
                        ? 'bg-sky-500/20 text-sky-400 border border-sky-500/40 shadow-sm'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </nav>

            {/* Main Content Area */}
            <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

              {/* 1. Dashboard Tab */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <h2 className="font-display font-bold text-2xl text-white">Operational Telemetry & Readiness Control</h2>
                      <p className="text-slate-400 text-xs mt-1">Real-time API request volume, rate limit breaches, event consistency, and freshness tracking.</p>
                    </div>
                    <button onClick={loadMetrics} className="bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 border border-sky-500/40 px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">
                      🔄 Refresh Metrics
                    </button>
                  </div>

                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="glass-card p-5 rounded-2xl">
                      <span className="text-xs text-slate-400 block mb-1">Total API Requests</span>
                      <span className="font-display font-extrabold text-2xl text-white">{metrics ? metrics.api_requests : '2,000'}</span>
                      <span className="text-[11px] text-emerald-400 block mt-2 font-semibold">{metrics ? metrics.success_rate : 84.3}% Success Rate</span>
                    </div>

                    <div className="glass-card p-5 rounded-2xl">
                      <span className="text-xs text-slate-400 block mb-1">Rate Limit 429 Breaches</span>
                      <span className="font-display font-extrabold text-2xl text-amber-400">{metrics ? metrics.rate_limit_429_rate : 2.0}%</span>
                      <span className="text-[11px] text-slate-400 block mt-2">Standard Tier (100 req/min)</span>
                    </div>

                    <div className="glass-card p-5 rounded-2xl">
                      <span className="text-xs text-slate-400 block mb-1">Deduplicated Events</span>
                      <span className="font-display font-extrabold text-2xl text-white">{metrics ? metrics.duplicate_events : 137}</span>
                      <span className="text-[11px] text-emerald-400 block mt-2 font-semibold">100% Safe (0 State Corruption)</span>
                    </div>

                    <div className="glass-card p-5 rounded-2xl">
                      <span className="text-xs text-slate-400 block mb-1">Avg Partner TTFSI</span>
                      <span className="font-display font-extrabold text-2xl text-emerald-400">{metrics ? metrics.avg_ttfsi_minutes : 17.5} min</span>
                      <span className="text-[11px] text-slate-400 block mt-2">P90 Target: 22.8 min</span>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. API Explorer Tab */}
              {activeTab === 'explorer' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Executable OpenAPI 3.0 Explorer & Try-It Client</h2>
                    <p className="text-slate-400 text-xs mt-1">Select an endpoint below to inspect request/response schemas or execute live API calls.</p>
                  </div>

                  <div className="space-y-4">
                    {endpoints.map((ep, i) => (
                      <div key={i} className="glass-card p-5 rounded-2xl border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                          <div className="flex items-center gap-3 mb-1">
                            <span className={`px-2.5 py-0.5 rounded text-xs font-mono font-bold ${ep.method === 'GET' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-sky-500/20 text-sky-400'}`}>
                              {ep.method}
                            </span>
                            <span className="font-mono text-sm font-bold text-white">{ep.path}</span>
                          </div>
                          <p className="text-xs text-slate-400">{ep.summary}</p>
                        </div>

                        <button
                          onClick={() => {
                            setTryItEp(ep);
                            setTryItBody(ep.body ? JSON.stringify(ep.body, null, 2) : '');
                            setTryItRes(null);
                          }}
                          className="bg-sky-500 hover:bg-sky-400 text-white font-semibold text-xs px-4 py-2 rounded-xl cursor-pointer"
                        >
                          ⚡ Try It Live
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* Try-It Inspector Modal */}
                  {tryItEp && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4">
                      <div className="glass-card bg-slate-900 p-6 rounded-2xl w-full max-w-2xl border border-slate-700 space-y-4 max-h-[85vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                          <span className="font-mono font-bold text-sky-400">{tryItEp.method} {tryItEp.path}</span>
                          <button onClick={() => setTryItEp(null)} className="text-slate-400 hover:text-white">✕</button>
                        </div>

                        {['POST', 'PATCH'].includes(tryItEp.method) && (
                          <div>
                            <label className="text-xs text-slate-400 block mb-1">Request Body (JSON)</label>
                            <textarea value={tryItBody} onChange={(e) => setTryItBody(e.target.value)} rows={6} className="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono text-sky-300" />
                          </div>
                        )}

                        <button onClick={handleTryItExecute} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">
                          ▶ Execute Request
                        </button>

                        {tryItRes && (
                          <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs font-mono space-y-2">
                            <div className="flex justify-between text-slate-400">
                              <span>Response Code: <strong className="text-emerald-400">HTTP {tryItRes.status}</strong></span>
                            </div>
                            <pre className="text-emerald-300 text-[11px] overflow-x-auto">
                              {JSON.stringify(tryItRes.data, null, 2)}
                            </pre>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* 3. Rate Limits Tab */}
              {activeTab === 'limits' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-amber-950/40 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Rate Limits & Quota Management</h2>
                    <p className="text-slate-400 text-xs mt-1">Standard (100 req/min), Premium (500 req/min), and Burst (20 req/sec) limits with standard headers.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="glass-card p-5 rounded-2xl">
                      <h3 className="font-bold text-white text-sm mb-2">Standard Tier</h3>
                      <p className="text-xs text-sky-400 font-mono font-bold">100 requests / minute</p>
                      <p className="text-xs text-slate-400 font-mono">Burst: 20 req/sec</p>
                    </div>
                    <div className="glass-card p-5 rounded-2xl">
                      <h3 className="font-bold text-white text-sm mb-2">Premium Tier</h3>
                      <p className="text-xs text-emerald-400 font-mono font-bold">500 requests / minute</p>
                      <p className="text-xs text-slate-400 font-mono">Burst: 50 req/sec</p>
                    </div>
                    <div className="glass-card p-5 rounded-2xl">
                      <h3 className="font-bold text-white text-sm mb-2">Enterprise Tier</h3>
                      <p className="text-xs text-purple-400 font-mono font-bold">2,000 requests / minute</p>
                      <p className="text-xs text-slate-400 font-mono">Burst: 200 req/sec</p>
                    </div>
                  </div>
                </div>
              )}

              {/* 4. Events & Evidence Tab */}
              {activeTab === 'events' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Event Processing, Idempotency & Evidence Store</h2>
                    <p className="text-slate-400 text-xs mt-1">State machine transition model: CREATED ➔ PICKED_UP ➔ IN_TRANSIT ➔ OUT_FOR_DELIVERY ➔ DELIVERED.</p>
                  </div>

                  <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                    <div className="flex gap-3">
                      <input type="text" value={evidenceId} onChange={(e) => setEvidenceId(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-xs font-mono text-sky-400 flex-1" />
                      <button onClick={() => loadEvidence(evidenceId)} className="bg-sky-500 hover:bg-sky-400 text-white font-bold text-xs px-4 py-2 rounded-xl cursor-pointer">
                        Query Evidence
                      </button>
                    </div>

                    {evidenceData && (
                      <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3 font-mono text-xs">
                        <div className="flex justify-between">
                          <span>Entity: <strong className="text-white">{evidenceData.entity_id}</strong></span>
                          <span>Current State: <strong className="text-emerald-400">{evidenceData.current_state}</strong></span>
                          <span>Duplicates: <strong className="text-amber-400">{evidenceData.duplicate_count} Ignored</strong></span>
                        </div>
                        <pre className="text-emerald-300 text-[11px] overflow-x-auto max-h-64">
                          {JSON.stringify(evidenceData.evidence_audit_trail, null, 2)}
                        </pre>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* 5. Failure Injector Tab */}
              {activeTab === 'simulator' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-rose-950/40 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Admin Operational Failure Injection Panel</h2>
                    <p className="text-slate-400 text-xs mt-1">Inject real operational failure cases to verify state preservation and recovery.</p>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <button onClick={() => handleInject('duplicate')} className="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 p-3 rounded-xl font-mono text-xs font-bold cursor-pointer">
                      ⚡ Inject Duplicate Event
                    </button>
                    <button onClick={() => handleInject('out_of_order')} className="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 p-3 rounded-xl font-mono text-xs font-bold cursor-pointer">
                      ⚡ Inject Out-of-Order Event
                    </button>
                    <button onClick={() => handleInject('rate_limit')} className="bg-slate-800 hover:bg-slate-700 text-rose-300 border border-rose-500/30 p-3 rounded-xl font-mono text-xs font-bold cursor-pointer">
                      💥 Trigger Rate Limit (429)
                    </button>
                  </div>

                  {injResult && (
                    <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 font-mono text-xs space-y-2">
                      <span className="text-emerald-400 font-bold block">Backend Recovery Response:</span>
                      <pre className="text-emerald-300 text-[11px] overflow-x-auto">
                        {JSON.stringify(injResult, null, 2)}
                      </pre>
                    </div>
                  )}
                </div>
              )}

              {/* 6. Experiments Tab */}
              {activeTab === 'experiments' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Partner Onboarding Experiment & TTFSI Metric</h2>
                    <p className="text-slate-400 text-xs mt-1">Comparing 30 simulated partner trials: Static Documentation (42.0m) vs Operational Portal (17.5m).</p>
                  </div>
                  <div className="glass-card p-6 rounded-2xl font-mono text-xs space-y-2">
                    <span className="text-emerald-400 font-bold block text-sm">Experiment Key Metric Results:</span>
                    <p className="text-slate-300">Mean TTFSI Baseline: 42.0 min | Improved: 17.5 min (-58.3% reduction)</p>
                    <p className="text-slate-300">P90 TTFSI Baseline: 52.0 min | Improved: 22.8 min (-56.1% reduction)</p>
                    <p className="text-slate-300">First-Call Success Rate Baseline: 25.0% | Improved: 80.0% (+55% increase)</p>
                  </div>
                </div>
              )}

              {/* 7. Security Tab */}
              {activeTab === 'security' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h2 className="font-display font-bold text-2xl text-white">Security Safeguards & Misuse Resistance</h2>
                    <p className="text-slate-400 text-xs mt-1">Zero trust defaults, API key header auth, 1MB size limits, sanitized exceptions.</p>
                  </div>
                </div>
              )}

              {/* 8. Docs & Risk Register Tab */}
              {activeTab === 'docs' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 p-6 rounded-2xl border border-slate-800">
